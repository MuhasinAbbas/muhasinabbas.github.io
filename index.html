<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Muhasin Abbas Portfolio</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}


html{
    scroll-behavior:smooth;
}


body{

    background:#ffffff;
    color:#000000;

}



/* NAVIGATION BAR */

nav{

    position:fixed;
    top:0;
    left:0;
    width:100%;

    height:80px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 60px;

    background:white;

    z-index:1000;

}


/* LOGO */

.logo{

    font-size:22px;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:1px;

}



/* MENU */

.menu{

    display:flex;
    gap:40px;

}


.menu a{

    text-decoration:none;
    color:black;

    font-size:16px;
    font-weight:700;

    position:relative;

}



/* HOVER UNDERLINE */

.menu a::after{

    content:"";

    position:absolute;

    left:0;
    bottom:-8px;

    width:0%;
    height:3px;

    background:black;

    transition:0.4s;

}



.menu a:hover{

    color:#777;

}



.menu a:hover::after{

    width:100%;

}





/* LANDING PAGE */


.hero{

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    flex-direction:column;

    padding-top:80px;

}




/* SLOGANS */


.slogan{

    font-size:20px;

    font-weight:800;

    letter-spacing:4px;

    margin-bottom:25px;

}



/* BIG PORTFOLIO */


.portfolio{

    font-size:clamp(80px,14vw,220px);

    font-weight:1000;

    letter-spacing:8px;

    line-height:0.9;

    position:relative;

    cursor:pointer;

    transition:0.3s;

}



/* PORTFOLIO HOVER */


.portfolio:hover{

    color:#555;

    animation:shake 0.4s;

}




@keyframes shake{


0%{
transform:translateX(0);
}


25%{
transform:translateX(-8px);
}


50%{
transform:translateX(8px);
}


75%{
transform:translateX(-5px);
}


100%{
transform:translateX(0);
}


}




/* UNDERLINE BAR */


.portfolio::after{

    content:"";

    position:absolute;

    bottom:-25px;

    left:0;

    width:100%;

    height:8px;

    background:black;

    transition:0.5s;

}



.portfolio:hover::after{

    background:#555;

    height:14px;

}





/* BOTTOM TITLES */


.roles{

    margin-top:55px;

    font-size:20px;

    font-weight:800;

    letter-spacing:4px;

}



/* PLACEHOLDER SECTIONS */


section{

    height:100vh;

    padding-top:100px;

    text-align:center;

}


#about{

    background:#f5f5f5;

}


#skills{

    background:#ffffff;

}


#works{

    background:#f5f5f5;

}


#contact{

    background:#ffffff;

}


</style>


</head>



<body>



<nav>

<div class="logo">

Muhasin Abbas Portfolio

</div>


<div class="menu">

<a href="#about">ABOUT</a>

<a href="#skills">SKILLS</a>

<a href="#works">WORKS</a>

<a href="#contact">CONTACT</a>

</div>


</nav>





<section class="hero">


<div class="slogan">

DESIGNS THAT ATTRACTS . FRAMES THAT SPEAKS

</div>



<div class="portfolio">

PORTFOLIO

</div>



<div class="roles">

CONTENT CREATOR . GRAPHIC DESIGNER . VIDEO EDITOR

</div>



</section>






<section id="about">

<h1>ABOUT</h1>

</section>



<section id="skills">

<h1>SKILLS</h1>

</section>




<section id="works">

<h1>WORKS</h1>

</section>




<section id="contact">

<h1>CONTACT</h1>

</section>



</body>

</html>
