<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Muhasin Abbas | Portfolio</title>

<!-- Google Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

/* =======================================================
   RESET
======================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    font-family:'Poppins',sans-serif;

    color:white;

    background-image:url("b3bd86f7-404f-4465-a81e-2986c739f822.jpg");

    background-size:cover;

    background-position:center;

    background-repeat:no-repeat;

    background-attachment:fixed;

}



/* =======================================================
   NAVIGATION BAR
======================================================= */

nav{

    position:fixed;

    top:0;

    left:0;

    width:100%;

    height:70px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:0 45px;

    background:rgba(255,255,255,0.92);

    backdrop-filter:blur(8px);

    z-index:9999;

    box-shadow:0 5px 18px rgba(0,0,0,.08);

}



/* =======================================================
   LOGO
======================================================= */

.logo{

    display:flex;

    align-items:center;

}

.logo img{

    height:38px;

    width:auto;

}



/* =======================================================
   MENU
======================================================= */

.menu{

    display:flex;

    gap:28px;

}

.menu a{

    text-decoration:none;

    color:#111;

    font-size:12px;

    font-weight:600;

    letter-spacing:1px;

    position:relative;

    transition:.35s;

}

.menu a::after{

    content:"";

    position:absolute;

    left:0;

    bottom:-6px;

    width:0%;

    height:2px;

    background:#000;

    transition:.35s;

}

.menu a:hover{

    color:#777;

}

.menu a:hover::after{

    width:100%;

}



/* =======================================================
   HERO
======================================================= */

.hero{

    width:100%;

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    text-align:center;

    background:rgba(0,0,0,.25);

}



/* =======================================================
   TOP SLOGAN
======================================================= */

.slogan{

    font-size:15px;

    font-weight:600;

    letter-spacing:6px;

    margin-bottom:28px;

    text-transform:uppercase;

}



/* =======================================================
   PORTFOLIO TITLE
======================================================= */

.portfolio{

    font-size:clamp(90px,15vw,230px);

    font-weight:900;

    letter-spacing:10px;

    text-transform:uppercase;

    line-height:.9;

    position:relative;

    cursor:pointer;

    transition:.35s;

}

.portfolio::after{

    content:"";

    position:absolute;

    left:0;

    bottom:-20px;

    width:100%;

    height:7px;

    background:white;

    transition:.35s;

}

.portfolio:hover{

    transform:scale(1.02);

    letter-spacing:15px;

}

.portfolio:hover::after{

    height:12px;

}



/* =======================================================
   BOTTOM TEXT
======================================================= */

.roles{

    margin-top:55px;

    font-size:15px;

    font-weight:600;

    letter-spacing:5px;

    text-transform:uppercase;

}



/* =======================================================
   COMMON SECTION STYLE
======================================================= */

section{

    min-height:100vh;

    padding:120px 10%;

}

.section-overlay{

    background:rgba(0,0,0,.45);

    border-radius:18px;

    padding:60px;

}

.section-title{

    font-size:60px;

    font-weight:800;

    margin-bottom:30px;

    text-transform:uppercase;

}

.section-text{

    font-size:18px;

    line-height:1.9;

    max-width:900px;

}

/* ===== PART 2 CONTINUES FROM HERE ===== */
